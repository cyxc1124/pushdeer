name: Build and Push to GHCR

on:
  push:
    branches:
      - main
      - develop
      - cyxc/self-hosted
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - cyxc/self-hosted

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-and-push:
    name: Build PushDeer API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version metadata
        id: version
        run: |
          GIT_COMMIT=$(git rev-parse HEAD)
          GIT_BRANCH=${GITHUB_REF#refs/heads/}
          GIT_TAG=""
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_NUMBER=${{ github.run_number }}

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            GIT_TAG=${GITHUB_REF#refs/tags/}
            GIT_BRANCH=""
          fi

          echo "git-commit=${GIT_COMMIT}" >> $GITHUB_OUTPUT
          echo "git-branch=${GIT_BRANCH}" >> $GITHUB_OUTPUT
          echo "git-tag=${GIT_TAG}" >> $GITHUB_OUTPUT
          echo "build-time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "build-number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT

          echo "Git Tag: ${GIT_TAG}"
          echo "Git Branch: ${GIT_BRANCH}"
          echo "Git Commit: ${GIT_COMMIT:0:8}"
          echo "Build Time: ${BUILD_TIME}"
          echo "Build Number: ${BUILD_NUMBER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Build and push PushDeer API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build Summary
        run: |
          echo "## PushDeer API 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 版本信息" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Tag**: ${{ steps.version.outputs.git-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Branch**: ${{ steps.version.outputs.git-branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Commit**: ${{ steps.version.outputs.git-commit }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: ${{ steps.version.outputs.build-time }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ steps.version.outputs.build-number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker 镜像 (API 独立版)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY